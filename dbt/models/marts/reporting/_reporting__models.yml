models:

  - name: marketing_performance_daily
    description: >
      Wide, analysis-ready marketing performance. Grain: one row per
      platform, campaign and day. Built for analysts, BI tools and AI agents.
      Use spend_eur to compare or total spend across platforms (spend is in
      the original currency). Facebook covers 2025; Snapchat covers
      2024-01-01 to 2024-12-02; the platforms do not overlap in time.
      CTR, CPC and CPM are valid only at this grain. For any other grouping
      (e.g. platform x month), recompute them from summed clicks,
      impressions and spend_eur; never average these columns.

    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ['platform', 'campaign_id', 'ad_date']

    columns:
      - name: campaign_day_key
        description: Surrogate primary key (hash of campaign_key + ad_date).
        data_tests: [unique, not_null]

      - name: platform
        description: >
          Advertising platform: 'facebook' or 'snapchat'.
        data_tests:
          - accepted_values:
              arguments:
                values: ['facebook', 'snapchat']

      - name: campaign_key
        description: Foreign key to dim_campaign.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_campaign')
                field: campaign_key

      - name: campaign_id
        description: Platform's campaign ID. Unique only within a platform.
      - name: campaign_name
        description: Campaign name as set in the platform's Ads Manager.
        data_tests: [not_null]
      - name: account_id
        description: Ad account that owns the campaign.
      - name: account_name
        description: Ad account name. Facebook only; NULL for Snapchat.
      - name: ad_date
        description: Reporting date.
        data_tests: [not_null]
      - name: week_start
        description: Monday of the week containing ad_date. Group by this for weekly trends.
      - name: month_start
        description: First day of the month containing ad_date. Group by this for monthly trends.
      - name: year
        description: Calendar year of ad_date.

      - name: currency_code
        description: Currency of `spend` (USD or EUR).
      - name: spend
        description: Spend in the original currency. Don't sum across currencies.
      - name: spend_eur
        description: Spend converted to EUR with daily ECB rates. Use for all cross-platform comparisons.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: impressions
        description: Number of times the campaign's ads were shown that day.
      - name: clicks
        description: Number of clicks on the campaign's ads that day.
      - name: active_ads
        description: Number of distinct ads with a row that day.

      - name: ctr
        description: >
          Click-through rate = clicks / impressions, as a fraction (0.0123 =
          1.23%). NULL when impressions = 0. Valid at campaign x day only.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: cpc_eur
        description: >
          Cost per click in EUR = spend_eur / clicks. NULL when clicks = 0
          (undefined, not free). Valid at campaign x day only.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: cpm_eur
        description: >
          Cost per 1,000 impressions in EUR = spend_eur / impressions x 1000.
          NULL when impressions = 0. Valid at campaign x day only.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0