models:

  - name: fct_ad_performance_daily
    description: >
      Daily advertising performance for Facebook and Snapchat in one table.
      Grain: one row per platform, ad_id and ad_date.
      Spend is stored in the original currency (spend + currency_code) and
      converted to EUR (spend_eur) with daily ECB reference rates. Use
      spend_eur for any total that spans platforms or accounts.
      Coverage: Facebook 2025-01-01 to 2025-12-31; Snapchat 2024-01-01 to
      2024-12-02. The platforms do not overlap in time.
      Incremental (merge): each run reprocesses the last N days (var
      lookback_days) so restated platform numbers replace old values.

    data_tests:
      # Grain check, independent of how the surrogate key is built.
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ['platform', 'ad_id', 'ad_date']
      # Sanity: an ad can't be clicked more times than it was shown.
      - dbt_utils.expression_is_true:
          arguments:
            expression: "clicks <= impressions"
          config:
            severity: warn

    columns:
      - name: ad_performance_key
        description: Surrogate primary key, hashed from platform, ad_id and ad_date.
        data_tests: [unique, not_null]

      - name: campaign_key
        description: Foreign key to dim_campaign (hash of platform + campaign_id).
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_campaign')
                field: campaign_key

      - name: platform
        description: Advertising platform, lowercase.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['facebook', 'snapchat']

      - name: ad_id
        description: Platform's ad ID (string; numeric for Facebook, UUID for Snapchat).
        data_tests: [not_null]

      - name: ad_date
        description: Reporting date, in the ad account's time zone.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day

      - name: campaign_id
        description: Platform's campaign ID. Unique only within a platform; join on campaign_key.
        data_tests: [not_null]

      - name: ad_group_id
        description: Platform's ad group (ad set) ID.

      - name: currency_code
        description: ISO 4217 currency of `spend` (USD or EUR).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['USD', 'EUR']

      - name: spend
        description: >
          Media spend in the original currency (see currency_code). Do NOT sum
          across currencies; use spend_eur for cross-currency totals.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0

      - name: spend_eur
        description: >
          Media spend converted to EUR: spend / ECB daily rate (units per EUR).
          Weekends and holidays use the last published rate. The default
          metric for comparing or totalling spend.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0

      - name: impressions
        description: Number of times ads were shown.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0

      - name: clicks
        description: >
          Number of clicks. Missing source values are counted as 0 (see
          is_clicks_reported).
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0

      - name: is_clicks_reported
        description: False when the source sent no click value and clicks was set to 0.

      - name: _loaded_at
        description: Timestamp when this row was last written by dbt. Shows which rows the last incremental run touched.